<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Bodeguita | BN Servicios, Tiempos JPS y Abarrotes</title>
<style>
:root{
  /* COLORES DEL BN (aproximados: reemplazar con los oficiales del manual de marca) */
  --bn-primary:#00843d;
  --bn-dark:#0b3d24;
  --bn-accent:#ffc72c;

  /* COLORES POR NEGOCIO */
  --bn-color:#00843d;
  --lot-color:#f4a300;
  --abr-color:#d7263d;

  /* FOTO DE FONDO DE LA PORTADA: pegar aquí una URL propia, por ejemplo url("https://...jpg") */
  --hero-img:linear-gradient(120deg,#0b3d24 0%,#00843d 55%,#0f9d4f 100%);

  /* BASE */
  --ink:#1d2433;--muted:#64708a;--bg:#f7f8f4;--card:#ffffff;--line:#e4e7df;--danger:#b23a3a;
  --grad:linear-gradient(135deg,var(--abr-color) 0%,var(--bn-dark) 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-weight:600;letter-spacing:.2px}
a{color:var(--bn-primary)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px;width:100%}

/* ---------- ENCABEZADO ---------- */
header.top{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 14px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 12px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap}
.logo-box{width:44px;height:44px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;letter-spacing:.5px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.brand-txt b{display:block;font-size:17px;color:var(--ink)}
.brand-txt small{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
nav a{color:var(--ink);text-decoration:none;font-family:system-ui,sans-serif;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px}
nav a:hover{background:#f0f2ec}
nav a.on{background:var(--grad);color:#fff}
nav a.llamar{background:linear-gradient(135deg,#c8102e,#1b3358);color:#fff;margin-left:6px}

/* ---------- PORTADA ---------- */
.hero{position:relative;color:#fff;text-align:center;padding:90px 0 110px;background:linear-gradient(180deg,rgba(11,61,36,.55) 0%,rgba(11,61,36,.88) 100%),var(--hero-img);background-size:cover;background-position:center;overflow:hidden}
.hero-inner{position:relative;max-width:900px;margin:0 auto;padding:0 16px}
.pill-glass{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:system-ui,sans-serif;font-size:14px;padding:8px 18px;border-radius:999px}
.hero h1{font-size:60px;line-height:1.1;margin:26px 0 18px;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.grad-text{background:linear-gradient(90deg,#ff4d5a,#ffc72c);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero > .hero-inner > p{color:#e6f4ec;max-width:640px;margin:0 auto;font-size:19px;font-family:system-ui,sans-serif}
.search-hero{max-width:680px;margin:34px auto 0;background:#fff;border-radius:999px;display:flex;align-items:center;padding:6px 6px 6px 20px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:system-ui,sans-serif}
.search-hero span{color:#8a93a6;font-size:18px}
.search-hero input{flex:1;border:none;outline:none;font-size:16px;padding:12px 10px;background:transparent;color:var(--ink);font-family:inherit;min-width:0}
.search-hero button{background:var(--abr-color);color:#fff;border:none;border-radius:999px;padding:12px 24px;font-weight:700;font-size:15px;cursor:pointer}
.cta{margin-top:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn-grad,.btn-glass{display:inline-block;padding:13px 24px;border-radius:999px;text-decoration:none;font-family:system-ui,sans-serif;font-weight:700;font-size:15px}
.btn-grad{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(215,38,61,.35)}
.btn-glass{background:#fff;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:760px;margin:56px auto 0;font-family:system-ui,sans-serif}
.stat{background:rgba(255,255,255,.92);border-radius:16px;padding:22px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.stat strong{display:block;font-size:34px;color:var(--sc);font-family:Georgia,serif;line-height:1.1}
.stat span{display:block;margin-top:8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.scroll-hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:system-ui,sans-serif;font-size:13px;color:rgba(255,255,255,.85)}

/* ---------- SECCIONES ---------- */
main{flex:1}
.pad{padding:64px 0}
.pad-s{padding:40px 0}
.sec-title{text-align:center;font-size:30px;color:var(--bn-dark);margin-bottom:8px}
.sec-sub{text-align:center;color:var(--muted);margin-bottom:34px;font-family:system-ui,sans-serif}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}

/* ---------- TARJETAS ---------- */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.qcard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:24px 20px;text-decoration:none;color:var(--ink);box-shadow:0 4px 16px rgba(11,61,36,.07);transition:transform .15s}
.qcard:hover{transform:translateY(-3px)}
.qcard .icono{width:46px;height:46px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.qcard h3{color:var(--bn-dark);font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c,var(--bn-dark));border-radius:12px;padding:22px 20px;box-shadow:0 4px 14px rgba(11,61,36,.06)}
.card h3{color:var(--bn-dark);font-size:19px;margin:8px 0}
.card p{color:var(--muted);font-family:system-ui,sans-serif;font-size:15px;margin-top:8px}
.card small{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-family:system-ui,sans-serif;color:#fff;letter-spacing:.3px}
.empty{color:var(--muted);padding:16px 0;text-align:center;font-family:system-ui,sans-serif}

/* ---------- NOTICIAS / FILTROS ---------- */
.filtros{display:flex;flex-direction:column;gap:14px;margin-bottom:28px;font-family:system-ui,sans-serif}
.filtros input{max-width:520px;margin:0 auto;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip.on{background:var(--bn-dark);color:#fff;border-color:var(--bn-dark)}

/* ---------- EVENTOS ---------- */
.evento{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;font-family:system-ui,sans-serif}
.fecha-box{min-width:70px;text-align:center;background:var(--lot-color);color:var(--bn-dark);border-radius:8px;padding:8px 6px;height:fit-content}
.fecha-box b{display:block;font-size:26px;line-height:1}
.fecha-box span{font-size:12px;font-weight:700;letter-spacing:.5px}
.evento h3{color:var(--bn-dark);font-size:18px;margin-bottom:4px}
.evento small{color:var(--muted)}
.evento p{color:var(--ink);margin-top:6px;font-size:15px}

/* ---------- FORMULARIOS ---------- */
.form-pub{background:#fff;border:1px solid var(--line);border-top:5px solid var(--bn-accent);border-radius:12px;padding:26px;max-width:640px;margin:0 auto;font-family:system-ui,sans-serif;display:grid;gap:14px}
.flash{max-width:640px;margin:0 auto 20px;background:#e8f6ee;border:1px solid var(--bn-primary);color:var(--bn-dark);padding:14px 18px;border-radius:10px;font-family:system-ui,sans-serif}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;font-family:system-ui,sans-serif}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;font-family:inherit}
textarea{resize:vertical}
.btn{background:var(--bn-primary);color:#fff;border:none;padding:11px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;font-family:system-ui,sans-serif}
.btn:hover{filter:brightness(1.1)}
.btn.gold{background:var(--bn-accent);color:var(--bn-dark)}
.btn.del{background:var(--danger)}
.btn.small{padding:6px 10px;font-size:12px}
.btn.wa{background:#25d366}

/* ---------- CONTACTO ---------- */
.contacto-box{text-align:center;font-family:system-ui,sans-serif;background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;max-width:640px;margin:0 auto}
.contacto-box p{margin:10px 0;font-size:16px}

/* ---------- ADMIN ---------- */
.adm-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;font-family:system-ui,sans-serif}
.adm-head h2{color:var(--bn-dark);font-size:24px}
.adm-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:22px;font-family:system-ui,sans-serif}
.adm-tabs button{border:2px solid var(--line);background:#fff;padding:9px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:14px}
.adm-tabs button.on{background:var(--bn-dark);border-color:var(--bn-dark);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:22px;font-family:system-ui,sans-serif}
.panel h3{color:var(--bn-dark);margin-bottom:14px;font-size:18px}
.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-family:system-ui,sans-serif}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}

/* ---------- PIE Y BOTÓN FLOTANTE ---------- */
footer{background:var(--bn-dark);color:#cfe9d9;padding:34px 0;text-align:center;font-family:system-ui,sans-serif;font-size:14px}
footer b{color:var(--bn-accent)}
footer a{color:#9fd3b3}
.aviso-jps{margin-top:10px;font-size:13px;color:#a9c9b6;font-style:italic}
.float-chat{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.3);z-index:60}

/* ---------- RESPONSIVE ---------- */
@media (max-width:700px){
  .hero{padding:60px 0 90px}
  .hero h1{font-size:42px}
  .hero > .hero-inner > p{font-size:16px}
  .stats{grid-template-columns:1fr}
  nav a{font-size:13px;padding:7px 10px}
  .brand-txt b{font-size:15px}
}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio">
      <div class="logo-box">BN</div>
      <div class="brand-txt">
        <b>La Bodeguita</b>
        <small>Agente autorizado BN</small>
      </div>
    </a>
    <nav>
      <a href="#inicio" data-r="inicio">Inicio</a>
      <a href="#noticias" data-r="noticias">Noticias</a>
      <a href="#eventos" data-r="eventos">Tiempos</a>
      <a href="#pedidos" data-r="pedidos">Pedidos</a>
      <a href="#contacto" data-r="contacto">Contacto</a>
      <a class="llamar" href="tel:+506XXXXXXXX">📞 Llamar</a>
    </nav>
  </div>
</header>

<main>
  <div id="app" class="wrap"></div>
</main>

<footer>
  <div class="wrap">
    <p><b>La Bodeguita</b> · Agente autorizado Banco Nacional de Costa Rica · © 2026</p>
    <p class="aviso-jps">Tiempos es un juego oficial de la Junta de Protección Social (JPS). Juegue con responsabilidad.</p>
    <p style="margin-top:10px"><a href="#admin">Acceso administración</a></p>
  </div>
</footer>

<a class="float-chat" href="https://wa.me/506XXXXXXXX" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">💬</a>

<script>
/* ============ CONFIGURACIÓN ============ */
const ADMIN_PIN = '1234';                 // Cambiar por un PIN propio
const WA_NUMBER = '506XXXXXXXX';          // Número de WhatsApp con código de país (506...)
const KEY = 'bodeguita-web-v1';

const CATS = ['Tiempos JPS','BN Servicios','Abarrotes','General'];
const TIPOS_PEDIDO = ['Abarrotes a domicilio','Servicio BN','Consulta de Tiempos'];
const ESTADOS = ['Nuevo','En proceso','Listo','Entregado'];
const CAT_COLOR = {
  'Tiempos JPS':'var(--lot-color)',
  'BN Servicios':'var(--bn-color)',
  'Abarrotes':'var(--abr-color)',
  'General':'var(--bn-dark)'
};

/* ============ DATOS DE EJEMPLO (reemplazar) ============ */
const SEED = {
  noticias: [
    { id:'n1', cat:'Abarrotes',    titulo:'Ejemplo: nuevos productos en La Bodeguita', fecha:'2026-10-10', resumen:'Texto de ejemplo. Reemplazar con la noticia real.' },
    { id:'n2', cat:'BN Servicios', titulo:'Ejemplo: horario de servicios BN',          fecha:'2026-10-05', resumen:'Texto de ejemplo. Reemplazar con la información real.' },
    { id:'n3', cat:'Tiempos JPS',  titulo:'Ejemplo: aviso sobre Tiempos',              fecha:'2026-10-01', resumen:'Texto de ejemplo. Reemplazar con el aviso oficial.' }
  ],
  eventos: [
    { id:'e1', titulo:'Ejemplo: sorteo de Tiempos', fecha:'2026-11-01', lugar:'La Bodeguita', desc:'Reemplazar con la información real del sorteo.' }
  ],
  pedidos: []
};

/* ============ ESTADO ============ */
let db = load();
let noticiasFiltro = { q:'', cat:'Todas' };
let adminTab = 'noticias';
let flash = '';

function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.noticias)) return d;
  } catch(e) {}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('No se pudo guardar en este navegador'); }
}

/* ============ UTILIDADES ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fechaES = f => f ? new Date(f + 'T00:00:00').toLocaleDateString('es-CR',{day:'numeric',month:'long',year:'numeric'}) : '';
const fechaHora = iso => new Date(iso).toLocaleString('es-CR',{dateStyle:'short',timeStyle:'short'});
const hoyISO = () => new Date().toISOString().slice(0,10);

/* ============ PÁGINAS ============ */
function cardNoticia(n){
  const c = CAT_COLOR[n.cat] || 'var(--bn-dark)';
  return `
    <article class="card" style="--c:${c}">
      <span class="tag" style="background:${c}">${esc(n.cat)}</span>
      <h3>${esc(n.titulo)}</h3>
      <small>${fechaES(n.fecha)}</small>
      <p>${esc(n.resumen)}</p>
    </article>`;
}

function pInicio(){
  const quick = [
    { t:'BN Servicios', i:'🏦', c:'var(--bn-color)',  r:'pedidos'  },
    { t:'Tiempos JPS',  i:'🎯', c:'var(--lot-color)', r:'eventos'  },
    { t:'Abarrotes',    i:'🛒', c:'var(--abr-color)', r:'pedidos'  },
    { t:'Noticias',     i:'📰', c:'var(--bn-primary)',r:'noticias' },
    { t:'Contacto',     i:'📞', c:'var(--bn-dark)',   r:'contacto' }
  ];
  return `
    <section class="hero">
      <div class="hero-inner">
        <span class="pill-glass">✨ Agente autorizado Banco Nacional de Costa Rica</span>
        <h1>Bienvenidos a<br><span class="grad-text">La Bodeguita</span></h1>
        <p>Trámites bancarios, Tiempos (juego oficial de la JPS) y productos básicos para su hogar, todo en un mismo lugar.</p>
        <form id="form-busqueda" class="search-hero">
          <span>🔍</span>
          <input name="q" placeholder="Buscar noticias, avisos, sorteos…">
          <button type="submit">Buscar</button>
        </form>
        <div class="cta">
          <a class="btn-grad" href="#pedidos">Ver servicios →</a>
          <a class="btn-glass" href="#contacto">📍 Visítenos</a>
        </div>
        <div class="stats">
          <div class="stat" style="--sc:var(--bn-primary)"><strong>BN</strong><span>Agente autorizado</span></div>
          <div class="stat" style="--sc:var(--lot-color)"><strong>JPS</strong><span>Juego oficial Tiempos</span></div>
          <div class="stat" style="--sc:var(--abr-color)"><strong>3</strong><span>Negocios en un solo lugar</span></div>
        </div>
      </div>
      <span class="scroll-hint">Desplácese para explorar ↓</span>
    </section>

    <section class="pad">
      <h2 class="sec-title">Acceso rápido</h2>
      <p class="sec-sub">Lo que necesitás, en unos segundos</p>
      <div class="quick">
        ${quick.map(q => `
          <a class="qcard" href="#${q.r}" style="--c:${q.c}">
            <div class="icono">${q.i}</div>
            <h3>${esc(q.t)}</h3>
          </a>`).join('')}
      </div>
    </section>

    <section class="pad-s">
      <h2 class="sec-title">Últimos avisos</h2>
      <p class="sec-sub">Novedades de la bodeguita</p>
      <div class="grid3">${db.noticias.slice(0,3).map(cardNoticia).join('')}</div>
      <p style="text-align:center;margin-top:22px"><a href="#noticias">Ver todas las noticias →</a></p>
    </section>`;
}

function pNoticias(){
  return `
    <section class="pad-s">
      <h2 class="sec-title">Noticias y avisos</h2>
      <p class="sec-sub">Anuncios y novedades</p>
      <div class="filtros">
        <input id="buscar" placeholder="Buscar noticias…" value="${esc(noticiasFiltro.q)}">
        <div class="chips">
          ${['Todas', ...CATS].map(c => `
            <button class="chip ${noticiasFiltro.cat === c ? 'on' : ''}" data-act="chip" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>
      </div>
      <div class="grid3" id="lista-noticias"></div>
    </section>`;
}

function filtrarNoticias(){
  const el = document.getElementById('lista-noticias');
  if (!el) return;
  const q = noticiasFiltro.q.toLowerCase();
  const lista = db.noticias.filter(n =>
    (noticiasFiltro.cat === 'Todas' || n.cat === noticiasFiltro.cat) &&
    (n.titulo + ' ' + n.resumen).toLowerCase().includes(q)
  );
  el.innerHTML = lista.length ? lista.map(cardNoticia).join('') : '<p class="empty">No hay noticias con ese filtro</p>';
}

function pEventos(){
  const lista = [...db.eventos].sort((a,b) => a.fecha.localeCompare(b.fecha));
  return `
    <section class="pad-s">
      <h2 class="sec-title">Tiempos y eventos</h2>
      <p class="sec-sub">Próximos sorteos y actividades</p>
      <div style="max-width:720px;margin:0 auto">
        ${lista.length ? lista.map(ev => {
          const d = new Date(ev.fecha + 'T00:00:00');
          const mes = d.toLocaleDateString('es-CR',{month:'short'}).replace('.','').toUpperCase();
          return `
          <div class="evento">
            <div class="fecha-box"><b>${d.getDate()}</b><span>${mes}</span></div>
            <div>
              <h3>${esc(ev.titulo)}</h3>
              <small>📍 ${esc(ev.lugar)} · ${fechaES(ev.fecha)}</small>
              <p>${esc(ev.desc)}</p>
            </div>
          </div>`;
        }).join('') : '<p class="empty">No hay eventos programados</p>'}
      </div>
    </section>`;
}

function pPedidos(){
  return `
    <section class="pad-s">
      <h2 class="sec-title">Pedidos y solicitudes</h2>
      <p class="sec-sub">Déjenos su solicitud y lo atendemos a la brevedad</p>
      ${flash ? `<div class="flash">${flash}</div>` : ''}
      <form id="form-pedido" class="form-pub">
        <div><label>Tipo de solicitud</label>
          <select name="tipo">${TIPOS_PEDIDO.map(t => `<option>${esc(t)}</option>`).join('')}</select></div>
        <div><label>Nombre</label><input name="nombre" required></div>
        <div><label>Teléfono</label><input name="tel" type="tel" required></div>
        <div><label>Detalle de la solicitud</label>
          <textarea name="detalle" rows="4" required placeholder="Ej. 2 kilos de arroz, 1 jabón de platos…"></textarea></div>
        <button class="btn gold" type="submit">Enviar solicitud</button>
      </form>
    </section>`;
}

function pContacto(){
  return `
    <section class="pad-s">
      <h2 class="sec-title">Contáctenos</h2>
      <p class="sec-sub">Estamos para ayudarle</p>
      <div class="contacto-box">
        <p>📍 [Dirección]</p>
        <p>📞 [Teléfono]</p>
        <p>✉️ [Correo]</p>
        <p>🕘 [Horario de atención]</p>
        <p style="margin-top:18px">
          <a class="btn wa" style="color:#fff;text-decoration:none;display:inline-block" target="_blank" rel="noopener"
             href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent('Hola, quisiera más información.')}">Escribir por WhatsApp</a>
        </p>
      </div>
    </section>`;
}

function pAdmin(){
  const tabs = [['noticias','Noticias'],['eventos','Tiempos y eventos'],['pedidos','Pedidos']];
  let cuerpo = '';

  if (adminTab === 'noticias'){
    cuerpo = `
      <div class="panel">
        <h3>Nueva noticia</h3>
        <form id="form-noticia" class="grid-form">
          <div><label>Título</label><input name="titulo" required></div>
          <div><label>Categoría</label><select name="cat">${CATS.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
          <div><label>Fecha</label><input name="fecha" type="date" value="${hoyISO()}" required></div>
          <div style="grid-column:1/-1"><label>Resumen</label><textarea name="resumen" rows="3" required></textarea></div>
          <div><button class="btn gold" type="submit">Publicar</button></div>
        </form>
      </div>
      <div class="panel"><h3>Noticias publicadas</h3>
        <div class="scroll"><table>
          <thead><tr><th>Fecha</th><th>Categoría</th><th>Título</th><th></th></tr></thead>
          <tbody>${db.noticias.map(n => `
            <tr><td>${esc(n.fecha)}</td><td>${esc(n.cat)}</td><td>${esc(n.titulo)}</td>
            <td><button class="btn small del" data-act="del-noticia" data-id="${n.id}">Eliminar</button></td></tr>`).join('')}
          </tbody>
        </table></div>
      </div>`;
  }

  if (adminTab === 'eventos'){
    cuerpo = `
      <div class="panel">
        <h3>Nuevo evento</h3>
        <form id="form-evento" class="grid-form">
          <div><label>Título</label><input name="titulo" required></div>
          <div><label>Fecha</label><input name="fecha" type="date" value="${hoyISO()}" required></div>
          <div><label>Lugar</label><input name="lugar" value="La Bodeguita"></div>
          <div style="grid-column:1/-1"><label>Descripción</label><textarea name="desc" rows="3"></textarea></div>
          <div><button class="btn gold" type="submit">Publicar</button></div>
        </form>
      </div>
      <div class="panel"><h3>Eventos</h3>
        <div class="scroll"><table>
          <thead><tr><th>Fecha</th><th>Título</th><th>Lugar</th><th></th></tr></thead>
          <tbody>${db.eventos.map(e => `
            <tr><td>${esc(e.fecha)}</td><td>${esc(e.titulo)}</td><td>${esc(e.lugar)}</td>
            <td><button class="btn small del" data-act="del-evento" data-id="${e.id}">Eliminar</button></td></tr>`).join('')}
          </tbody>
        </table></div>
      </div>`;
  }

  if (adminTab === 'pedidos'){
    cuerpo = `
      <div class="panel"><h3>Solicitudes recibidas</h3>
        ${db.pedidos.length ? `<div class="scroll"><table>
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Cliente</th><th>Detalle</th><th>Estado</th><th></th></tr></thead>
          <tbody>${db.pedidos.map(p => `
            <tr>
              <td>${fechaHora(p.fecha)}</td>
              <td>${esc(p.tipo)}</td>
              <td>${esc(p.nombre)}<br><small>${esc(p.tel)}</small></td>
              <td>${esc(p.detalle)}</td>
              <td><select data-act="estado" data-id="${p.id}">
                ${ESTADOS.map(s => `<option ${s === p.estado ? 'selected' : ''}>${s}</option>`).join('')}
              </select></td>
              <td><button class="btn small del" data-act="del-pedido" data-id="${p.id}">✕</button></td>
            </tr>`).join('')}
          </tbody></table></div>`
        : '<p class="empty">No hay solicitudes todavía</p>'}
      </div>`;
  }

  return `
    <section class="pad-s">
      <div class="adm-head">
        <h2>Administración</h2>
        <button class="btn small" data-act="logout">Salir</button>
      </div>
      <div class="adm-tabs">
        ${tabs.map(([k,l]) => `<button class="${adminTab === k ? 'on' : ''}" data-act="atab" data-t="${k}">${l}</button>`).join('')}
      </div>
      ${cuerpo}
    </section>`;
}

/* ============ RENDER Y RUTAS ============ */
function render(r){
  const pages = { inicio:pInicio, noticias:pNoticias, eventos:pEventos, pedidos:pPedidos, contacto:pContacto, admin:pAdmin };
  const fn = pages[r] || pInicio;
  document.getElementById('app').innerHTML = fn();
  document.querySelectorAll('nav a[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === r));
  if (r === 'noticias') filtrarNoticias();
  window.scrollTo(0,0);
}

function route(){
  let r = location.hash.replace('#','') || 'inicio';
  if (r === 'admin' && sessionStorage.getItem('adm') !== 'ok'){
    const pin = prompt('PIN de administración');
    if (pin === ADMIN_PIN){
      sessionStorage.setItem('adm','ok');
    } else {
      if (pin !== null) alert('PIN incorrecto');
      location.hash = 'inicio';
      return;
    }
  }
  if (r !== 'pedidos') flash = '';
  render(r);
}
window.addEventListener('hashchange', route);

/* ============ EVENTOS ============ */
const app = document.getElementById('app');

app.addEventListener('input', e => {
  if (e.target.id === 'buscar'){
    noticiasFiltro.q = e.target.value;
    filtrarNoticias();
  }
});

app.addEventListener('change', e => {
  const el = e.target.closest('[data-act="estado"]');
  if (el){
    const p = db.pedidos.find(x => x.id === el.dataset.id);
    if (p){ p.estado = el.value; save(); }
  }
});

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;

  if (act === 'chip'){
    noticiasFiltro.cat = b.dataset.cat;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.cat === noticiasFiltro.cat));
    filtrarNoticias();
  }
  if (act === 'atab'){ adminTab = b.dataset.t; render('admin'); }
  if (act === 'logout'){
    sessionStorage.removeItem('adm');
    location.hash = 'inicio';
  }
  if (act === 'del-noticia' && confirm('¿Eliminar esta noticia?')){
    db.noticias = db.noticias.filter(n => n.id !== b.dataset.id);
    save(); render('admin');
  }
  if (act === 'del-evento' && confirm('¿Eliminar este evento?')){
    db.eventos = db.eventos.filter(x => x.id !== b.dataset.id);
    save(); render('admin');
  }
  if (act === 'del-pedido' && confirm('¿Eliminar esta solicitud?')){
    db.pedidos = db.pedidos.filter(x => x.id !== b.dataset.id);
    save(); render('admin');
  }
});

app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const d = Object.fromEntries(new FormData(f).entries());

  if (f.id === 'form-busqueda'){
    noticiasFiltro.q = (d.q || '').trim();
    noticiasFiltro.cat = 'Todas';
    location.hash = 'noticias';
    render('noticias');
  }

  if (f.id === 'form-pedido'){
    const id = uid();
    db.pedidos.unshift({ id, tipo:d.tipo, nombre:d.nombre.trim(), tel:d.tel.trim(), detalle:d.detalle.trim(), estado:'Nuevo', fecha:new Date().toISOString() });
    save();
    const texto = `Hola, soy ${d.nombre}. Solicitud: ${d.tipo}. ${d.detalle}`;
    flash = `¡Gracias ${esc(d.nombre)}! Recibimos su solicitud. Si quiere confirmarla más rápido, escríbanos por <a href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener">WhatsApp</a>.`;
    render('pedidos');
  }

  if (f.id === 'form-noticia'){
    db.noticias.unshift({ id:uid(), cat:d.cat, titulo:d.titulo.trim(), fecha:d.fecha, resumen:d.resumen.trim() });
    save(); render('admin');
  }

  if (f.id === 'form-evento'){
    db.eventos.push({ id:uid(), titulo:d.titulo.trim(), fecha:d.fecha, lugar:(d.lugar||'').trim(), desc:(d.desc||'').trim() });
    save(); render('admin');
  }
});

route();
</script>
</body>
</html>
