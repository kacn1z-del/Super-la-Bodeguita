<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Bodeguita · Panel Admin</title>
<style>
:root{
  --char-950:#171310;--char-900:#221b16;--char-700:#3a2c22;
  --flame-600:#d9391f;--flame-500:#e8792b;--ember-400:#f2a53a;--gold-200:#f6d98a;
  --paper:#fbf4ea;--paper-dim:#f3e6d5;
  --ink-900:#241c15;--ink-600:#6b5945;--ink-400:#8f7c68;
  --amber-500:#e8792b;--red-500:#c92f1c;--status-green:#3f9868;
  --glass-bg:rgba(255,250,242,.65);--glass-border:rgba(255,255,255,.8);--glass-strong:rgba(255,250,242,.85);
  --font-display:'Bricolage Grotesque','Sora',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',monospace;
  --radius-lg:22px;--radius-md:14px;--radius-sm:9px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font-body);color:var(--ink-900);background:var(--paper);-webkit-font-smoothing:antialiased;font-size:16px;font-weight:600;line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.01em;font-weight:700}
h1{font-size:32px}h2{font-size:28px}h3{font-size:24px}h4{font-size:20px}
p{margin:0;font-size:16px;font-weight:600}
button{font-family:var(--font-body);cursor:pointer;font-weight:700;font-size:16px}
input,textarea,select{font-family:var(--font-body);font-size:16px;font-weight:600}
a{color:inherit;font-weight:600}
::selection{background:var(--ember-400);color:var(--char-950)}
:focus-visible{outline:2px solid var(--flame-600);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
#app{min-height:100vh}

/* ---------- SHELL ---------- */
.app-shell{position:relative;display:flex;min-height:100vh;overflow:hidden;background:var(--paper)}
.canopy{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.canopy--one{width:720px;height:720px;top:-260px;right:-220px;background:radial-gradient(circle at 30% 30%,var(--ember-400) 0%,var(--flame-600) 55%,transparent 75%);opacity:.5}
.canopy--two{width:520px;height:520px;bottom:-240px;left:220px;background:radial-gradient(circle at 60% 60%,var(--gold-200) 0%,transparent 70%);opacity:.55}

/* Sidebar */
.sidebar{position:relative;z-index:2;width:232px;flex-shrink:0;background:var(--char-950);color:var(--gold-200);display:flex;flex-direction:column;padding:24px 16px;gap:28px}
.sidebar__brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.sidebar__mark{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--flame-600),var(--ember-400));color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:13px;flex-shrink:0}
.sidebar__mark--lg{width:56px;height:56px;font-size:20px;margin:0 auto}
.sidebar__title{font-family:var(--font-display);color:var(--paper);font-weight:700;font-size:15px;margin:0}
.sidebar__subtitle{font-size:12px;color:var(--ember-400);margin:0}
.sidebar__nav{display:flex;flex-direction:column;gap:4px}
.sidebar__link{display:flex;align-items:center;gap:12px;background:transparent;border:none;color:var(--gold-200);font-size:14px;font-weight:500;padding:10px 12px;border-radius:var(--radius-sm);text-align:left;text-decoration:none;transition:background .15s ease,color .15s ease}
.sidebar__link:hover{background:rgba(255,255,255,.06);color:var(--paper)}
.sidebar__link.is-active{background:var(--flame-600);color:var(--paper)}
.sidebar__icon{width:18px;text-align:center;font-size:15px}
.sidebar__footer{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:var(--ember-400)}
.sidebar__footer .btn-secondary{color:var(--gold-200);border-color:var(--char-700)}
.sidebar__project{color:var(--gold-200);font-size:12px}

.app-main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;padding:28px 36px 12px;gap:16px;flex-wrap:wrap}
.topbar__title{font-size:24px;font-weight:700;color:var(--char-950)}
.topbar__subtitle{margin-top:4px;font-size:13px;color:var(--ink-600)}
.topbar__right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar__status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;padding:8px 14px;border-radius:999px;background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(14px);color:var(--ink-600)}
.topbar__dot{width:8px;height:8px;border-radius:50%;background:var(--status-green)}
.topbar__logout{background:rgba(201,47,28,.08);border:1px solid rgba(201,47,28,.25);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--red-500);white-space:nowrap}
.low-stock{margin:0 36px 4px;background:rgba(201,47,28,.1);color:var(--red-500);padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:700}
.app-content{padding:12px 36px 48px;display:flex;flex-direction:column;gap:28px}

/* ---------- MÉTRICAS Y BLOQUES ---------- */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.metric-card{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(18px);border-radius:var(--radius-lg);padding:20px 22px}
.metric-card__label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-400);margin-bottom:10px}
.metric-card__value{font-size:32px;font-weight:600;color:var(--char-950)}
.metric-card__hint{margin-top:6px;font-size:12px;color:var(--ink-400)}
.metric-card--mint{border-color:rgba(116,198,157,.6)}
.metric-card--amber .metric-card__value{color:#a86a1c}
.section-block{display:flex;flex-direction:column;gap:14px}
.section-block__title{font-size:16px;font-weight:600;color:var(--char-950)}
.panel{background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:var(--radius-lg);overflow:hidden}
.panel--empty{padding:40px 28px;text-align:center;color:var(--ink-600);font-size:14px;display:flex;flex-direction:column;gap:6px}
.panel__hint{color:var(--ink-400);font-size:12px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:end;padding:20px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-600)}
.field input,.field select,.field textarea{border:1px solid rgba(16,36,27,.16);background:rgba(255,255,255,.7);border-radius:var(--radius-sm);padding:9px 12px;font-size:14px;color:var(--ink-900);font-weight:500}
.field textarea{resize:vertical}

/* ---------- TABLAS ---------- */
.table-wrap{overflow-x:auto}
.orders-table{width:100%;border-collapse:collapse;font-size:13px}
.orders-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);padding:14px 12px;border-bottom:1px solid rgba(16,36,27,.08)}
.orders-table td{padding:14px 12px;border-bottom:1px solid rgba(16,36,27,.06);color:var(--ink-900);vertical-align:top}
.orders-table tr:last-child td{border-bottom:none}
.order-sub{font-size:11px;color:var(--ink-400);margin-top:2px;display:inline-block}
.order-items{font-size:12px;color:var(--ink-600)}
.order-actions{display:flex;flex-wrap:wrap;gap:6px}
.action-btn{font-size:11px;font-weight:600;padding:6px 10px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;white-space:nowrap;background:var(--paper-dim);color:var(--ink-900)}
.action-btn:disabled{opacity:.5;cursor:not-allowed}
.action-btn--blue{background:rgba(63,122,200,.14);color:#2f5aa8}
.action-btn--green{background:rgba(63,152,104,.16);color:var(--status-green)}
.action-btn--amber{background:rgba(232,163,61,.16);color:#a86a1c}
.action-btn--red{background:rgba(201,47,28,.12);color:var(--red-500)}
.stock-ctrl{display:inline-flex;align-items:center;gap:8px}
.stock-ctrl .action-btn{width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.is-low{color:var(--red-500)!important}

/* Mobile: las tablas se vuelven tarjetas */
@media (max-width:640px){
  .orders-table thead{display:none}
  .orders-table,.orders-table tbody,.orders-table tr,.orders-table td{display:block;width:100%}
  .orders-table tr{padding:14px 16px;border-bottom:1px solid rgba(16,36,27,.1)}
  .orders-table td{padding:3px 0;border-bottom:none}
  .orders-table td::before{content:attr(data-label);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-400);margin-bottom:2px}
}

/* ---------- BADGES Y BOTONES ---------- */
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge--amber{background:rgba(232,163,61,.18);color:#a86a1c}
.badge--blue{background:rgba(63,122,200,.16);color:#2f5aa8}
.badge--green{background:rgba(63,152,104,.18);color:var(--status-green)}
.badge--gray{background:rgba(111,138,124,.16);color:var(--ink-600)}
.badge--red{background:rgba(209,83,63,.16);color:var(--red-500)}
.badge--purple{background:rgba(124,58,179,.14);color:#7c3ab3}
.btn-primary{background:var(--flame-600);color:var(--paper);border:none;padding:11px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600}
.btn-primary:disabled{opacity:.5}
.btn-secondary{background:transparent;color:var(--ink-900);border:1px solid var(--char-700);padding:11px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600}

/* ---------- SORTEOS ---------- */
.sorteos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.sorteo-card{background:rgba(255,255,255,.5);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:18px}
.sorteo-card h3{font-size:20px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-hora{font-family:var(--font-mono);font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--paper-dim);color:var(--ink-900)}
.chip-hora.is-next{background:var(--flame-600);color:var(--paper)}

/* ---------- LOGIN ---------- */
.login-screen{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--char-950);padding:20px;overflow:hidden}
.login-card{position:relative;z-index:1;background:var(--paper);border-radius:var(--radius-lg);padding:32px 28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.login-card h2{font-size:26px;color:var(--char-950)}
.login-card .field{text-align:left}
.login-card .field input{font-size:18px;letter-spacing:.3em;text-align:center}
.login-error{color:var(--red-500);font-size:13px;min-height:18px}

/* ---------- RESPONSIVE ---------- */
@media (max-width:860px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;align-items:center;padding:12px 16px;gap:14px;overflow-x:auto}
  .sidebar__nav{flex-direction:row}
  .sidebar__link{white-space:nowrap}
  .sidebar__footer{display:none}
  .topbar,.app-content{padding-left:18px;padding-right:18px}
  .low-stock{margin:0 18px 4px}
}
</style>
</head>
<body>

<script>

    { id:'p3', nombre:'Jabón de platos (ejemplo)',  precio:1500, stock:10, minimo:4 }
  ]
};

/* ============ ESTADO ============ */
let db = load();
let logged = false;
try { logged = sessionStorage.getItem(SESS) === 'ok'; } catch(e) {}

function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.ventas) && Array.isArray(d.pedidos) && Array.isArray(d.productos)) {
      if (!Array.isArray(d.equipo)) d.equipo = [];
      return d;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(SEED));
}
function guardar(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ alert('No se pudo guardar en este navegador'); }
}

const fechaHora = iso => new Date(iso).toLocaleString('es-CR',{timeZone:TZ,dateStyle:'short',timeStyle:'short'});

const monto = v => /premio/i.test(v.tipo) ? -Number(v.monto) : Number(v.monto);
const neto = lista => lista.reduce((s,v) => s + monto(v), 0);

const sumaPago = (lista, pago) => neto(lista.filter(v => v.pago === pago));
